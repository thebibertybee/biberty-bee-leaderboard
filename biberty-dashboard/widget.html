<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biberty Bee Leaderboard Widget</title><style>body{margin:0;background:#f6f5f0;color:#17212c;font:14px system-ui,sans-serif}.widget{background:white;border:1px solid #e5e3db;border-radius:16px;padding:20px;max-width:650px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:21px;letter-spacing:-.04em;margin:0}.bee{background:#ffd84d;border-radius:9px;padding:6px}#status{font-size:11px;color:#68717a}ol{list-style:none;margin:16px 0;padding:0}li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eee}li:last-child{border:0}.rank{color:#89919a;width:22px;font-weight:900}.account{flex:1;min-width:0;overflow-wrap:anywhere}.count{font-weight:900}a{color:inherit;text-decoration:none}footer{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:#68717a}footer a{background:#17212c;color:white;padding:9px 12px;border-radius:9px;font-weight:700}</style></head><body><div class="widget"><header><h2><span class="bee">🐝</span> LU Top 5</h2><span id="status">Loading…</span></header><ol id="list"></ol><footer><span>Counts update periodically</span><a href="./index.html" target="_blank" rel="noopener">Full leaderboard ↗</a></footer></div><script>const url='https://docs.google.com/spreadsheets/d/1VWFA9Q0dGfzOgcVFeE_QXfAVbbRc27DRz__paehFrj8/gviz/tq?tqx=out:csv&sheet=Leaderboard';function csv(s){let a=[],r=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'){r.push(v);a.push(r);r=[];v=''}else if(c!=='\r')v+=c}if(v||r.length){r.push(v);a.push(r)}return a}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function load(){try{let r=await fetch(url+'&_='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);let rows=csv(await r.text()),h=rows.shift().map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'')),find=(...names)=>h.findIndex(x=>names.includes(x)),ui=find('username','account','handle','instagramusername'),fi=find('followers','followercount','currentfollowercount','currentfollowers'),ni=find('displayname','name','accountname');if(ui<0||fi<0)throw Error('Unrecognized CSV headers');let a=rows.map(row=>({u:(row[ui]||'').replace(/^@/,''),n:ni>=0?row[ni]:row[ui],f:Number((row[fi]||'').replace(/,/g,''))})).filter(x=>x.u&&Number.isFinite(x.f)).sort((a,b)=>b.f-a.f).slice(0,5);document.getElementById('list').innerHTML=a.map((x,i)=>'<li><span class="rank">#'+(i+1)+'</span><a class="account" href="https://instagram.com/'+encodeURIComponent(x.u)+'" target="_blank" rel="noopener">@'+esc(x.u)+'</a><span class="count">'+x.f.toLocaleString()+'</span></li>').join('');document.getElementById('status').textContent='Latest available data'}catch(e){document.getElementById('status').textContent='Feed unavailable';document.getElementById('list').innerHTML='<li>Could not load follower counts.</li>'}}load();setInterval(load,300000)</script></body></html>
